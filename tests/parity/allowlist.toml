# -- watchdog -----------------------------------------------------------------

[[deviation]]
symbol = "watchdog.WatchDogTimeout"
status = "documented"
quote = "because `WatchDogMode.RAISE` itself is refused"
reason = "WatchDogTimeout is only ever raised by WatchDogMode.RAISE, and RAISE mode is refused at compile time."

# -- supervisor -----------------------------------------------------------------

[[deviation]]
symbol = "supervisor.RunReason"
status = "documented"
quote = "no auto-reload, and no safe-mode fallback runtime to report on"
reason = "Every boot of a fixed AOT-compiled program is equivalent to CircuitPython's STARTUP; there is no auto-reload or REPL-reload concept to distinguish."

[[deviation]]
symbol = "supervisor.SafeModeReason"
status = "documented"
quote = "no safe-mode fallback runtime to report on"
reason = "There is no safe-mode fallback interpreter state on this AOT-compiled layer."

[[deviation]]
symbol = "supervisor.Runtime"
status = "documented"
quote = "describe USB enumeration, an on-display status bar, and why CircuitPython's own supervisor"
reason = "supervisor.runtime already exists as a narrower instance (serial_connected, usb_connected, serial_bytes_available); the full Runtime class adds USB/display/BLE/auto-reload members this chip class has none of."

[[deviation]]
symbol = "supervisor.StatusBar"
status = "documented"
quote = "no USB stack, no display"
reason = "There is no attached display or REPL status-bar surface to back StatusBar."

[[deviation]]
symbol = "supervisor.status_bar"
status = "documented"
quote = "no USB stack, no display"
reason = "There is no attached display or REPL status-bar surface to back status_bar."

[[deviation]]
symbol = "supervisor.set_usb_identification"
status = "documented"
quote = "a bare-metal AVR build has no USB stack"
reason = "No USB device stack to carry a Device Descriptor to override."

[[deviation]]
symbol = "supervisor.get_previous_traceback"
status = "documented"
quote = "PyMCU's exception model carries no message string across a crash"
reason = "The AVR exception model is a T-flag, not a heap traceback object; there is no message text to persist or return."

[[deviation]]
symbol = "supervisor.get_setting"
status = "documented"
quote = "no filesystem"
reason = "No /settings.toml filesystem to read a setting from."

[[deviation]]
symbol = "supervisor.reset_terminal"
status = "documented"
quote = "no REPL"
reason = "There is no REPL serial terminal to resize."

[[deviation]]
symbol = "supervisor.set_next_code_file"
status = "documented"
quote = "no boot-time file search"
reason = "A PyMCU build compiles one fixed program ahead of time; there is no dynamic next-file selection at boot."

