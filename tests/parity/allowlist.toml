# Each [[deviation]] is one symbol the parity suite (tests/parity/) does not require to
# match circuitpython-stubs. `status` says why it is allowed to differ:
#   - "documented": a design decision this repo's own docs explain. `quote` must be an
#     exact substring of README.md or docs/ (whitespace-normalized) -- the decision has to
#     actually be written down, not just asserted here.
#   - "tracked:#N": a real gap, not a decision -- filed as issue #N in
#     PyMCU/pymcu-circuitpython. No `quote` is required: there is no design rationale to
#     quote, only an issue to point at. `reason` names the issue.

[[deviation]]
symbol = "keypad.Keys.__init__"
status = "documented"
quote = "`keypad.Keys` takes a list of `digitalio.DigitalInOut`, not a list of pin names."
reason = "The constructor deliberately accepts preconfigured DigitalInOut instances instead of pins."

[[deviation]]
symbol = "keypad.KeyMatrix"
status = "documented"
quote = "`rotaryio` and `keypad.KeyMatrix` are not implemented yet."
reason = "KeyMatrix is documented as not implemented."

[[deviation]]
symbol = "pulseio.PulseOut.send"
status = "documented"
quote = "`pulseio.PulseOut.send(pulses, count)` takes the count, because a module-level array loses its length when it crosses a parameter."
reason = "The layer requires an explicit count where CircuitPython derives the pulse count."

# -- alarm ------------------------------------------------------------------

[[deviation]]
symbol = "alarm.SleepMemory"
status = "documented"
quote = "there is no separate always-on RAM region to back a `SleepMemory`"
reason = "No true deep sleep to persist memory across; the alarm functions block in place instead of restarting."

[[deviation]]
symbol = "alarm.sleep_memory"
status = "documented"
quote = "there is no separate always-on RAM region to back a `SleepMemory`"
reason = "No true deep sleep to persist memory across; the alarm functions block in place instead of restarting."

[[deviation]]
symbol = "alarm.exit_and_deep_sleep_until_alarms"
status = "documented"
quote = "Up to four alarms at once"
reason = "Fixed alarm0..alarm3 parameters instead of *alarms: there is no heap for a variable-length argument list."

[[deviation]]
symbol = "alarm.light_sleep_until_alarms"
status = "documented"
quote = "Up to four alarms at once"
reason = "Fixed alarm0..alarm3 parameters instead of *alarms: there is no heap for a variable-length argument list."

# -- keypad -------------------------------------------------------------------

[[deviation]]
symbol = "keypad.ShiftRegisterKeys"
status = "documented"
quote = "`keypad.ShiftRegisterKeys` is not implemented either"
reason = "Reads through a shift-register chip, a different peripheral than the pin-per-key Keys this layer has."

[[deviation]]
symbol = "keypad.Event.key_number"
status = "tracked:#13"
reason = "keypad.Event is a caller-owned mutable buffer here (get_into() writes into it); the real gap is the same one #13 tracks for Keys/KeyMatrix."

[[deviation]]
symbol = "keypad.Event.pressed"
status = "tracked:#13"
reason = "Same as keypad.Event.key_number: a writable field on a mutable buffer, not a property on an immutable Event."

[[deviation]]
symbol = "keypad.Event.timestamp"
status = "tracked:#13"
reason = "Not tracked at all: the queue reports only which key changed, not when, tracked alongside the rest of #13's Event/EventQueue gap."

[[deviation]]
symbol = "keypad.EventQueue"
status = "tracked:#13"
reason = "The layer has a private _EventQueue with a narrower, allocation-free API (get_into only); no public EventQueue type is exported."

[[deviation]]
symbol = "keypad.Keys.events"
status = "tracked:#13"
reason = "keys.events exists at runtime (set in __init__) but is not a class-level property inspect.getattr_static can see; same #13 gap."

